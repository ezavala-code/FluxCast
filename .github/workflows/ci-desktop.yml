name: Desktop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm patchelf libfuse2t64
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fluxcast/desktop test
      - run: pnpm --filter @fluxcast/desktop tauri build --bundles rpm,appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
