name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install --locked --version 4.1.2 cargo-ndk
      - name: Check native Android builds
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a -t x86_64 build --locked -p fluxcast-uniffi
      - run: ./gradlew testDebugUnitTest assembleDebug
