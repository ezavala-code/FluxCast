name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install --locked --version 4.1.2 cargo-ndk
      - name: Build native Android libraries and UniFFI Kotlin bindings
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android-rust.sh
      - run: ./gradlew testDebugUnitTest assembleDebug
