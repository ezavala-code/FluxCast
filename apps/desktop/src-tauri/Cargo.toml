[package]
name = "fluxcast-desktop"
description = "Aplicación de escritorio FluxCast para Fedora KDE"
authors = ["FluxCast contributors"]
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "fluxcast-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ashpd = "0.12"
fluxcast-core = { path = "../../../crates/fluxcast-core" }
futures-util = "0.3"
gio = "0.18"
gtk = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "fluxcast-desktop"
path = "src/main.rs"

[[bin]]
name = "fluxcast"
path = "src/cli.rs"

[dev-dependencies]
tempfile = "3"
